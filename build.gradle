plugins {
    id 'java'
    id 'jacoco'
    id 'application'
    id 'dev.rafandoo.versioning' version '1.0.0'
}

application {
    mainClass = 'dev.rafandoo.finv.Sandbox'
}

group = 'dev.rafandoo'
version = versioning.name

ext.defaultManifestAttributes = { Project p ->
    return [
        'Manifest-Version'      : '1.0',
        'Specification-Version' : p.version,
        'Specification-Vendor'  : 'R+ Dev',
        'Specification-Title'   : 'Finv',
        'Implementation-Version': p.version,
        'Implementation-Vendor' : 'R+ Dev',
        'Implementation-Title'  : 'Finv',
        'Built-Date'            : new Date().toString(),
        'Built-JDK'             : System.getProperty('java.version'),
        'Built-OS'              : System.getProperty('os.name'),
        'Built-OS-Version'      : System.getProperty('os.version'),
        'Built-OS-Architecture' : System.getProperty('os.arch')
    ]
}

ext.configurePom = { MavenPublication pub ->
    pub.pom {
        name.set(pub.artifactId)
        description.set(project.description)
        url.set('https://github.com/rafandoo/finv')

        licenses {
            license {
                name.set('Apache License, Version 2.0')
                url.set('https://raw.githubusercontent.com/rafandoo/finv/refs/heads/main/LICENSE')
                distribution.set('repo')
            }
        }

        developers {
            developer {
                id.set('rafandoo')
                name.set('Rafael Camargo')
                email.set('rafaelcamargo.inf@gmail.com')
            }
        }

        scm {
            connection.set('scm:git:git://github.com/rafandoo/finv.git')
            developerConnection.set('scm:git:ssh://git@github.com/rafandoo/finv.git')
            url.set('https://github.com/rafandoo/finv')
            tag.set('HEAD')
        }

        issueManagement {
            system.set('GitHub Issues')
            url.set('https://github.com/rafandoo/finv/issues')
        }
    }
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    compileOnly 'org.slf4j:slf4j-api:2.0.17'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'

    implementation 'dev.rafandoo:cup-core:1.1.0-RC1'
    implementation 'dev.rafandoo:cup-objects:1.1.0-RC1'
    implementation 'dev.rafandoo:cup-http:1.1.0-RC1'
    implementation 'org.json:json:20250517'

    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.21.1'

    // Testing
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testImplementation 'org.assertj:assertj-core:3.27.3'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    testCompileOnly 'org.projectlombok:lombok:1.18.42'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

def jacocoExclusions = [
]

jacoco {
    toolVersion = '0.8.14'
}

jacocoTestReport {
    dependsOn test

    reports {
        xml.required = true
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir("jacocoHtml")

    }

    afterEvaluate {
        classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: jacocoExclusions)
            })
        )
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }

    afterEvaluate {
        classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: jacocoExclusions)
            })
        )
    }
}

check.dependsOn jacocoTestCoverageVerification

tasks.withType(Jar).configureEach {
    manifest {
        attributes = defaultManifestAttributes(project)
    }

    exclude('**/.gitkeep')
}

tasks.register('runnableJar', Jar) {
    group = 'build'
    description = 'Assembles a runnable jar archive containing the main class and all dependencies.'

    archiveClassifier.set('aio')

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    exclude('META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')

    with tasks.jar
}
